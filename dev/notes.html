<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mock permalink</title>
  </head>
  <body>
    <!--
      Stands in for a Tumblr permalink page during `npm run dev`: the same #tumblr-notes
      container theme/theme.html emits, filled with markup shaped like Tumblr's own notes.
      Not part of the build — publicDir is off, and lib builds ignore HTML files.
    -->
    <div id="tumblr-notes">
      <ol class="notes">
        <li class="note reply" id="note-1">
          <a href="https://juza.tumblr.com" class="avatar_frame"
            ><img class="avatar" src="https://via.placeholder.com/24" /></a
          >
          <span class="action"
            ><a href="https://juza.tumblr.com" class="tumblelog">juza</a>
            replied:</span
          >
          <div class="reply_text">
            <p>Ovo je ispalo <b>odlično</b> — koji je addon za UI?</p>
          </div>
        </li>
        <li class="note like" id="note-2">
          <a href="https://mara.tumblr.com" class="avatar_frame"
            ><img class="avatar" src="https://via.placeholder.com/24" /></a
          >
          <span class="action"
            ><a href="https://mara.tumblr.com" class="tumblelog">mara</a> liked
            this</span
          >
        </li>
        <li class="note reblog" id="note-3">
          <a href="https://ork.tumblr.com" class="avatar_frame"
            ><img class="avatar" src="https://via.placeholder.com/24" /></a
          >
          <span class="action"
            ><a href="https://ork.tumblr.com" class="tumblelog">ork</a>
            reblogged this from serbeeni</span
          >
        </li>
        <li class="note reply" id="note-4">
          <a href="https://nelf.tumblr.com" class="avatar_frame"
            ><img class="avatar" src="https://via.placeholder.com/24" /></a
          >
          <span class="action"
            ><a href="https://nelf.tumblr.com" class="tumblelog">nelf</a>
            replied:</span
          >
          <div class="reply_text">
            <p>Teldrassil at night hits different.</p>
          </div>
        </li>
      </ol>
      <a class="more_notes_link" href="#">Show more notes</a>
    </div>
  </body>
</html>
