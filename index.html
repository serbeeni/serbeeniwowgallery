<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Serbeeni WoW Gallery — dev</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Development harness only. It stands in for what Tumblr renders server-side, in exactly
      the shape `theme/theme.html` produces, so `npm run dev` exercises the real parser.
      `vite build` ignores this file — the build entry is src/main.tsx.
    -->
    <div id="root"></div>

    <div id="tumblr-config">
      <span data-field="title">Serbeeni WoW Gallery</span>
      <div data-field="description">Screenshots from a long trip through Azeroth.</div>
      <div data-field="pages"><a href="/guide">Guide</a><a href="/about">About</a></div>
    </div>

    <div id="tumblr-source">
      <article class="tumblr-post" data-post-id="1" data-post-type="text" data-permalink="/dev/notes.html" data-note-count="24"><div class="tumblr-post-body"><p>A quiet morning under the world tree. - Darnassus</p></div></article>
      <article class="tumblr-post" data-post-id="2" data-post-type="photo" data-photo-url="https://64.media.tumblr.com/8cf71ec3070c868f526b1ed00da77432/27f0076f1576f10e-4e/s2048x3072/b1f53ee684193f7548cdd3bc7c51bd2b07a3ad35.pnj" data-permalink="/dev/notes.html" data-note-count="7"><div class="tumblr-post-caption"><p>Moonwell at dusk - Ashenvale</p></div></article>
      <article class="tumblr-post" data-post-id="3" data-post-type="photo" data-photo-url="https://64.media.tumblr.com/8cf71ec3070c868f526b1ed00da77432/27f0076f1576f10e-4e/s2048x3072/b1f53ee684193f7548cdd3bc7c51bd2b07a3ad35.pnj" data-permalink="/dev/notes.html" data-note-count="1"><div class="tumblr-post-caption"><p>The canals - Stormwind City</p></div></article>
      <article class="tumblr-post" data-post-id="4" data-post-type="photo" data-photo-url="https://64.media.tumblr.com/8cf71ec3070c868f526b1ed00da77432/27f0076f1576f10e-4e/s2048x3072/b1f53ee684193f7548cdd3bc7c51bd2b07a3ad35.pnj" data-permalink="/dev/notes.html" data-note-count="0"><div class="tumblr-post-caption"><p>Deep below the mountain - Blackrock Depths, Searing Gorge</p></div></article>
      <article class="tumblr-post" data-post-id="5" data-post-type="text" data-permalink="/dev/notes.html" data-note-count="3"><div class="tumblr-post-body"><p>No location tag on this one at all.</p></div></article>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
